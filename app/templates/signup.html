<!-- Signup: Page for creating a new user account -->
{% extends "base.html" %}

{% block title %}Sign Up | CSPB Course Reviews{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}">
{% endblock %}

{% block content %}

<section id= "description">
    <h1>Sign Up</h1>
    <p>
       Please enter the following information to create your account. <br>
    </p>
</section>

<section class = "signup_form">

     <div class = "signup-container">
        <form action="{{ url_for('signup') }}" method="post">
            <label for="username"><strong>Username:</strong></label><br>
            <input type="text" id="username" name="username" required><br>
            
            <label for="email"><strong>Email:</strong></label><br>
            <input type="email" id="email" name="email" required><br>

            <label for="password"><strong>Password:</strong></label><br>
            <input type="password" id="password" name="password" required><br>

            <button class="button" type="submit">Sign Up</button>
            <p>Already a member? <a href="{{ url_for('login') }}">Log in</a>.</p>
        </form>
    </div>
</section>

{% endblock %}
